server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: finsentinel-ai
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finsentinel}}
    username: ${POSTGRES_USER:finsentinel}
    password: ${POSTGRES_PASSWORD:finsentinel_dev_local_change_me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-origin: ${FRONTEND_ORIGIN:https://*.vercel.app,http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  security:
    session-cookie-name: ${SESSION_COOKIE_NAME:FS_SESSION}
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
    session-cookie-same-site: ${SESSION_COOKIE_SAMESITE:None}
    session-ttl-minutes: ${SESSION_TTL_MINUTES:480}
    csrf-cookie-name: ${CSRF_COOKIE_NAME:XSRF-TOKEN}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@finsentinel.local}
  ai:
    provider: ${AI_PROVIDER:nvidia}
    model: ${AI_MODEL:nvidia/nemotron-3.5-bolt-e4b}
    mistral-model: ${MISTRAL_MODEL:mistral-large-latest}
    embedding-model: ${AI_EMBEDDING_MODEL:nvidia/nemotron-3.5-embed-1b}
    rag-enabled: ${AI_RAG_ENABLED:true}
    nvidia-api-key: ${NVIDIA_API_KEY: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}
    nvidia-api-key-2: ${NVIDIA_API_KEY_2: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}
    nvidia-api-key-3: ${NVIDIA_API_KEY_3:}
    nvidia-api-keys: ${NVIDIA_API_KEYS:}
    mistral-api-key: ${MISTRAL_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    local-base-url: ${AI_LOCAL_BASE_URL:}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT:30000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:true}
