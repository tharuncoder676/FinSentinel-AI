services:
  postgres:
    image: postgres:16-alpine
    container_name: finsentinel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-finsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsentinel_dev_local_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsentinel} -d ${POSTGRES_DB:-finsentinel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: finsentinel-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: finsentinel-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finsentinel}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finsentinel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finsentinel_dev_local_change_me}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      APP_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_LOCAL_BASE_URL: ${AI_LOCAL_BASE_URL:-}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-30000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: finsentinel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
