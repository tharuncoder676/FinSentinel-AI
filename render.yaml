# Render Blueprint for FinSentinel AI Spring Boot Backend
# Deploy via Render Dashboard -> New -> Blueprint (pointing to this repository)
services:
  - type: web
    name: finsentinel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        value: "jdbc:postgresql://db.jcpbjzywqzghkcmxobni.supabase.co:5432/postgres?sslmode=require"
      - key: POSTGRES_USER
        value: "finsentinel_app"
      - key: POSTGRES_PASSWORD
        value: "FinSentinel2026!AppPass"
      - key: AI_PROVIDER
        value: nvidia
      - key: AI_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: AI_EMBEDDING_MODEL
        value: nvidia/nemotron-3.5-embed-1b
      - key: AI_RAG_ENABLED
        value: "true"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_KEY_2
        sync: false
      - key: NVIDIA_API_KEY_3
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: MAIL_ENABLED
        value: "false"
      - key: DEMO_SEED_ENABLED
        value: "true"
